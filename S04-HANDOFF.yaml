decisions:
  - "Storage in var/studio (ignorato da Git, regola S00A sugli artefatti rigenerabili); identita = digest della RunConfig normalizzata + digest eventi + hash motore nel manifest."
  - "Lo Studio non ricalcola economia: chiama solo simulation.run e ricava ogni metrica dal registro canonico, cosi UI, summary.json e riconciliazione coincidono."
  - "Drawdown MTM calcolato con il capitale iniziale come primo punto; la curva passata a make_drawdown_figure include lo stesso punto per riusare il grafico esistente con definizione identica."
  - "Il motore S03 si arresta al primo gap: lo Studio non spezza i run, mostra i segmenti contigui e avvisa prima dell'avvio. Il dataset reale ha 14 buchi; il segmento piu lungo copre 2023-03-24 -> 2026-10-23."
  - "market_events() estratto da simulation.main e condiviso; momentum calcolato sul calendario orario. Per dati contigui e identico alla formula precedente (verificato da test); evita il confronto fra barre separate da un gap quando il periodo inizia dopo un buco. Cambia engine_sha256 (file simulation.py), previsto perche S03 non e ancora committato."
  - "Confronto: condizioni (dataset, manifest, periodo richiesto ed effettivo, digest eventi, latenza, orizzonte, fee, slippage, capitale, motore) separate dall'oggetto (strategia, rischio, modalita, esito)."
  - "Il paper replay e selezionabile come modalita del run; sessioni persistenti su feed restano in S06."
