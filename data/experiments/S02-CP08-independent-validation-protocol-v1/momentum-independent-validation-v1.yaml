# S02-CP08-04 · Momentum Threshold · Independent Validation Protocol
#
# IMMUTABLE, VERSIONED PRE-REGISTRATION.
#
# This file was frozen before any genuinely independent (future) data existed
# in the repository. Editing it in place is forbidden: a change requires a new
# `protocol_version`, a new file name (`...-v2.yaml`) and a new protocol
# archive. The sidecar `.sha256` pins the exact bytes of this file.
#
# It does NOT contain a new strategy and it does NOT authorise a new backtest on
# the already-observed research period. It defines how a *single* independent
# evaluation will be run and judged when new, untouched data arrives.
schema_version: cdl.cp08.independent_validation.protocol.v1
protocol_id: momentum-independent-validation
protocol_version: "1.0.0"
status: FROZEN
created_utc: "2026-10-30T00:00:00Z"
frozen_after_utc: "2026-10-30T00:00:00Z"
supersedes: null
owner: quantitative-research
scope: "S02-CP08-04"
purpose: >
  Evaluate, at most once per protocol version, whether the frozen Momentum
  Threshold (5%, 24h hold) retains a positive net edge in a realistic execution
  scenario (latency 1h, 0.20% per side, SHORT carry hypothesis) on genuinely
  new out-of-sample data, using a pre-registered walk-forward and pre-registered
  GO / NO-GO / INCONCLUSIVE criteria. The protocol cannot promote a strategy
  using data already observed during research.

# ---------------------------------------------------------------------------
# 1. Research phase: every period already observed / used for research.
# ---------------------------------------------------------------------------
research_phase:
  label: "S02-CP07 + S02-CP08-01/02/03"
  period_start_utc: "2021-01-01T00:00:00Z"
  period_end_exclusive_utc: "2026-10-23T16:00:00Z"
  last_used_target_end_utc: "2026-10-23T00:00:00Z"
