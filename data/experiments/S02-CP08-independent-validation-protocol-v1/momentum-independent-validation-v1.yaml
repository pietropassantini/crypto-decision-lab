  threshold: 0.05
  direction: symmetric
  horizon_hours: 24
  entry_semantics: "open of the bar at cutoff (first price after the anchor close)"
  exit_semantics: "open of the bar at cutoff + 24h"
  initial_capital_usdt: 10000.0
  sizing: "100% of current equity, no leverage, one position at a time"
  overlap_rule: "a signal whose entry is before the previous exit is skipped and counted"
  no_trade_rule: "flat, zero cost, no market occupancy"
  reference_costs:
    fee_rate: 0.001
    slippage: 0.0005
    total_per_side: 0.0015
