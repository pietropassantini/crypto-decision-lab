  last_label_cutoff_utc: "2026-10-22T00:00:00Z"
  oos_period_start_utc: "2023-06-10T00:00:00Z"
  oos_period_end_utc: "2026-10-22T00:00:00Z"
  windows: 500
  oos_windows: 300
  folds: 5
  used_for:
    - "CP07: selection of the frozen momentum threshold (5%) on train folds"
    - "CP08-01: simulator integrity audit and parameter-surface diagnostics"
    - "CP08-02: descriptive stability and profit concentration"
    - "CP08-03: pre-registered threshold grid, cost/latency/carry sensitivity"
  contamination_warning: >
    The 300 out-of-sample windows of CP07 were already observed. They cannot be
    reused as independent evidence, and no parameter may be chosen by looking at
    them again. CP08-03 already used them for exploratory surfaces.

  # Observed in the frozen snapshot but never used by any label, decision,
  # target or metric (the snapshot extends 15 hours beyond the last label exit).
  observed_unused_tail:
    start_utc: "2026-10-23T00:00:00Z"
    end_exclusive_utc: "2026-10-23T16:00:00Z"
    status: OBSERVED_NOT_INDEPENDENT
    usable_as_independent_evidence: false
    reason: >
      These bars are present in the frozen snapshot and were therefore observed
      during the research phase, even if no decision used them. They are not
      independent evidence.

