decisions:
  - "Exchange Binance Spot (fonte di tutti i dati del repo), collaudo su Spot Testnet; mainnet richiede allow_mainnet e CDL_LIVE_ALLOW_MAINNET=1, decisione S08."
  - "Ordini write-ahead: intento e client id committati prima dell'invio. Un client id non viene mai reinviato, perche Binance lo riaccetta dopo il fill: si interroga sempre l'ordine."
  - "Esito incerto (timeout, 5xx, -1007) -> UNKNOWN: nessuna barra elaborata e nessun ordine inviato finche la query non lo risolve; non trovato oltre unknown_grace_seconds -> NOT_PLACED."
  - "Portafoglio derivato solo dai fill dell'exchange (chiave trade_id) e dalle rettifiche dell'operatore; mai da prezzi simulati."
  - "Saldo disallineato blocca anche le uscite (stato non affidabile); le altre guardie bloccano solo le aperture."
  - "Esecuzione live immediata alla decisione (MARKET o LIMIT GTC con offset): latency_hours e slippage della RunConfig restano ipotesi di simulazione, da confrontare con l'osservato in S09."
  - "client id cdl-<prefisso8>-<seq6>: la documentazione letta non riporta regex e lunghezza, quindi alfabeto e lunghezza sono conservativi."
anomalies:
  - "Commissioni in un asset terzo (BNB) non sono convertite in quote: compaiono in book()['other_fees'] e nei delta di saldo, non nei costi in USDT."
  - "BinanceKlineFeed e BinanceSpotAdapter.submit/query non sono stati eseguiti contro la rete reale in questo step: solo fixture e shim."
