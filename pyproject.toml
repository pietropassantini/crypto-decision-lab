[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-decision-lab"
version = "0.2.0"
description = "Reproducible OHLCV ingestion, quality checks and read-only forecast dashboard"
requires-python = ">=3.11"
# PyYAML: protocol configuration and forward collection (core, not only the dashboard).
dependencies = ["requests>=2.31,<3", "pandas>=2.1,<3", "pyarrow>=15,<24", "PyYAML>=6,<7"]

[project.optional-dependencies]
# setuptools, wheel: `release package` builds the wheel with --no-build-isolation (S08, review R12).
dev = ["pytest>=8,<10", "scikit-learn>=1.4,<2", "setuptools>=68", "wheel"]
dashboard = [
    "streamlit>=1.45,<2",
    "plotly>=5.20,<7",
    "PyYAML>=6,<7",
    "kaleido>=1.0,<2",
]
forecast = [
    "torch>=2.4,<3",
    "timestral @ git+https://github.com/mistralai/timestral.git",
]

[project.scripts]
cdl = "crypto_decision_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
