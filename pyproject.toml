[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-decision-lab"
version = "0.2.0"
description = "Reproducible OHLCV ingestion, quality checks and read-only forecast dashboard"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "pandas>=2.1,<3", "pyarrow>=15,<24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
dashboard = [
    "streamlit>=1.45,<2",
    "plotly>=5.20,<7",
    "PyYAML>=6,<7",
    "kaleido>=1.0,<2",
]

[project.scripts]
cdl = "crypto_decision_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
