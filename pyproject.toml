[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-decision-lab"
version = "0.1.2"
description = "Reproducible OHLCV ingestion and quality checks for Crypto Decision Lab"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "pandas>=2.1,<3", "pyarrow>=15,<24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
cdl = "crypto_decision_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
