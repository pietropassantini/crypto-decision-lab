    verification: "python -m pytest tests/test_paper.py -k \"cp062 or revised or cp08\" tests/dashboard/test_strategy_studio.py -k cp062 -q -p no:cacheprovider --basetemp var/s06-cp062"
    expected: "Feed di laboratorio riproducibile: avvio, aggiornamento, pausa su gap, recupero controllato e stato visibile dalla UI"
    observed: "bars.jsonl byte-identico con avanzamento in un colpo o ora per ora. Ciclo: CREATED -> WAITING -> PAUSED_GAP (barra in ritardo) -> recupero automatico -> DATA_ERROR (open mancante) -> recupero alla correzione -> STALE (interruzione) -> backfill -> PAUSED_GAP (barra persa) -> gap riconosciuto (gap_acknowledged) -> SUSPENDED senza avanzamento -> ripresa -> COMPLETED; riconciliazione del registro superata. Revisione in conflitto -> DATA_ERROR senza avanzamento. Fonte forward, feed o sessioni sotto data/forward rifiutati. UI (AppTest): stato WAITING dopo il runner CLI a UI chiusa, avanzamento del feed -> PAUSED_GAP, riconoscimento del gap dalla UI, stato riletto in nuova sessione."
    evidence: "tests/test_paper.py::{test_cp062_lab_feed_is_reproducible,test_cp062_lab_feed_lifecycle_with_explicit_states,test_revised_or_conflicting_bar_is_a_data_error,test_lab_feed_and_sessions_stay_outside_cp08}; tests/dashboard/test_strategy_studio.py::test_cp062_paper_tab_shows_persisted_state_and_runner_works_without_ui"
