decisions:
  - "Engine a passi invece di un secondo motore: backtest, replay e paper usano la stessa transizione; CP03.2 ora e provato attraverso persistenza e ripresa."
  - "SQLite per sessione (WAL, synchronous=FULL), una transazione per evento; concorrenza ottimistica con version."
  - "Il feed espone open dell'ora e close dell'ora precedente: le feature usano solo barre chiuse; momentum_24h identico a market_events."
  - "Gap: pausa esplicita; recupero automatico se la barra arriva, altrimenti riconoscimento esplicito che annulla l'ordine pendente e non inventa prezzi."
  - "Pin all'avvio di configurazione, modello (sha) e motore (sha); la revisione del motore si accetta solo con un comando esplicito registrato nello storico."
  - "Identita del feed per contenuto (feed_id, scenario_sha256, fonte), non per percorso."
  - "Il feed di laboratorio rilegge uno snapshot di ricerca ammesso: resta fuori dal perimetro CP08 e non usa dati forward."
anomalies:
  - "Aprire una sessione con un repo_root errato rende il feed irraggiungibile e registra DATA_ERROR nel DB; si recupera riaprendo con il percorso corretto e avanzando."
  - "Le strategie S05 a decision point non ricevono le feature S02 nelle sessioni: nessuna apertura in paper con quelle strategie."
