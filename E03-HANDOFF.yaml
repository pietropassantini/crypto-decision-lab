decisions:
  - "Sviluppo (2021-02 / 2023-07): 1 configurazione positiva su 12. Selezionata g09 (ingresso 0,05, uscita 0, SMA 720 h): +4,09%, drawdown -15,36%, 56 trade (23,2/anno), lordo +63,2, costi 42,8, tempo in mercato 6,1%. Le configurazioni con SMA 168 h perdono tutte (da -21,2% a -45,4%, lordo negativo); con SMA 720 h vanno da -8,9% a +4,1%. Baseline: momentum_v1 -95,4%, E01 g11 -29,6%, buy and hold -4,0%."
  - "Validazione (2023-07 / 2025-01): g09 -4,65%, drawdown -10,24%, 41 trade (27,2/anno = 2,9% della baseline), lordo +7,1, costi 30,4, tempo in mercato 8,0%. Passano drawdown, numero di trade e turnover; falliscono rendimento netto > 0 e costi <= 50% del lordo. Baseline: momentum_v1 -85,40%, E01 g11 -20,28%, buy and hold +103,17%."
  - "Conferma (2025-01 / 2026-10, valutata una volta): g09 +0,61%, drawdown -5,68%, 18 trade, lordo +16,4; passa entrambi i criteri, ma l'esito e deciso dalla validazione. Baseline: momentum_v1 -91,09%, E01 g11 -28,21%, buy and hold -5,35%."
  - "Esito REJECTED secondo i criteri registrati. Isteresi e filtro di regime funzionano sul piano del rischio (drawdown da -24% a -10% rispetto a E01, turnover ridotto di 34 volte rispetto a momentum_v1, perdita molto piu contenuta), ma la strategia resta in mercato solo il 3-8% del tempo e cattura poco: in validazione, con BTC +103% in buy and hold, il lordo e +7,1 su 500. Il vantaggio lordo di momentum_24h orario resta troppo piccolo per i costi."
  - "Lettura complessiva E01-E03 (non preregistrata): tre varianti di momentum orario su BTCUSDT bocciate dagli stessi criteri. Continuare a variare soglie e filtri sullo stesso snapshot aumenterebbe il rischio di overfitting (le finestre sono gia state viste tre volte); un passo successivo sensato cambia famiglia di segnale o orizzonte (per esempio barre giornaliere), con una specifica nuova."
