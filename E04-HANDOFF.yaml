decisions:
  - "Sviluppo (2021-02 / 2023-07): tutte le 12 configurazioni negative, da -6,3% a -29,0%; 10 con almeno 30 trade. Selezionata g05 (entry_z 2,0, finestra 24 h, orizzonte 120 h): -6,27%, drawdown -15,55%, 93 trade (38,6/anno), lordo +36,6 (0,39 per trade), costi 68,0, 59% di trade vincenti. Le configurazioni con finestra 72 h hanno lordo fortemente negativo (da -81 a -120) e molte uscite a orizzonte: il prezzo non torna alla media a 72 h in tempo. Baseline: momentum_v1 -95,4%, buy and hold -4,0%."
  - "Validazione (2023-07 / 2025-01): g05 -7,21%, drawdown -13,40%, 136 trade (90,3/anno = 9,6% della baseline), lordo +61,4 (0,45 per trade), costi 97,5, 62% di trade vincenti, tutte le uscite per ritorno alla media. Passano drawdown, numero di trade e turnover; falliscono rendimento netto > 0 e costi <= 50% del lordo. Baseline: momentum_v1 -85,40%, buy and hold +103,17%."
  - "Conferma (2025-01 / 2026-10, valutata una volta): g05 -19,63%, drawdown -20,08%, 111 trade, lordo -22,7; fallisce net_return_pct > 0. Baseline: momentum_v1 -91,09%, buy and hold -5,35%."
  - "Esito REJECTED secondo i criteri registrati. Il segnale esiste ma e troppo piccolo: il prezzo torna davvero alla media (59-62% di trade vincenti, quasi tutte le uscite per reversione) e il lordo e positivo in sviluppo e validazione, ma vale 0,39-0,45 per trade contro un costo di circa 0,72 per trade (0,3% andata e ritorno su una posizione di 250). In conferma anche il lordo e negativo."
  - "Lettura complessiva E01-E04 (non preregistrata): quattro strategie di tre famiglie diverse (momentum, pattern di breakout, mean reversion) sulle barre orarie di BTCUSDT sono bocciate dallo stesso criterio. Il lordo medio per trade resta tra 0,2 e 0,9 contro una soglia di pareggio di circa 0,75 e una soglia di accettazione di circa 1,5. Con costi di 0,3% a round trip l'orizzonte orario non lascia margine: i passi successivi sensati cambiano il rapporto tra movimento atteso e costo (barre giornaliere o di 4 ore, ordini limite per ridurre il costo, un altro mercato), non un altro segnale sullo stesso orizzonte."
interpretations:
