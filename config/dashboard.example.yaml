# Crypto Decision Lab · dashboard configuration example
# Copy to config/dashboard.yaml for automatic loading, or set
# CDL_DASHBOARD_CONFIG=/path/to/file.yaml.

data:
  root: data
  snapshot_dir: data/snapshots/BTCUSDT-1h-raw-v1

forecast:
  batch_dir: data/experiments/S02-CP02-batch-100
  # If present, the dashboard prefers the 500-window S02-CP06A archive.
  expansion_dir: data/experiments/S02-CP06A-historical-expansion-v1
  residual_baselines_dir: data/experiments/S02-CP05-residual-baselines-v1
  # Optional additive CP05R benchmark. When present, the dashboard prefers it
  # for Ridge/HistGB prices; original CP05 remains untouched.
  residual_corrected_dir: data/experiments/S02-CP05R-corrected-benchmark-v1
  diagnostics_dir: data/diagnostics/S02-CP03-batch-100-v1
  residual_dataset_dir: data/datasets/S02-CP04-residuals-v1
  regime_dataset_dir: data/datasets/S02-CP06B-regime-features-v1
  policy_results_dir: data/experiments/S02-CP06B-selective-policy-v1
  trading_label_dir: data/datasets/S02-CP07-decision-labels-v1
  trading_experiment_dir: data/experiments/S02-CP07-trading-simulation-v1
  # Additive S02-CP08-02 stability archive (read-only in the dashboard).
  momentum_stability_dir: data/experiments/S02-CP08-momentum-stability-v1
  # Additive S02-CP08-03 parameter & execution robustness archive (read-only).
  parameter_robustness_dir: data/experiments/S02-CP08-parameter-robustness-v1
  # Additive S02-CP08-04 independent validation protocol archive (read-only).
  validation_protocol_dir: data/experiments/S02-CP08-independent-validation-protocol-v1
  # Optional future S03 archive. Compatible columns are documented in
  # src/crypto_decision_lab/dashboard/forecast_adapter.py.
  decision_glob: data/experiments/S03-*
  default_mode: h24_common
  default_models: [timestral, naive]

display:
  default_timeframe: 1D
  default_days: 3650
  chart_height: 650
  cache_ttl_seconds: 300
  source_label: "BTCUSDT · Binance Spot · 1h · UTC"

integrity:
  verify_checksums: true

regimes:
  # Past-only 168h log-return volatility thresholds and 168h trend thresholds.
  volatility_bins: [0.005, 0.008]
  trend_bins: [-0.05, 0.05]

colors:
  actual: "#f0b90b"
  timestral: "#4cc9f0"
  naive: "#9aa4b2"
  ridge: "#ff8f6b"
  histgb: "#b388ff"
  decision: "#2dd4bf"

# Optional: omit this key to use the built-in preset catalogue in indicators.py.
indicator_presets:
  - {key: sma, params: {window: 7}}
  - {key: sma, params: {window: 20}}
  - {key: sma, params: {window: 50}}
  - {key: sma, params: {window: 100}}
  - {key: sma, params: {window: 200}}
  - {key: ema, params: {window: 9}}
  - {key: ema, params: {window: 12}}
  - {key: ema, params: {window: 26}}
  - {key: ema, params: {window: 50}}
  - {key: ema, params: {window: 200}}
  - {key: macd, params: {fast: 12, slow: 26, signal: 9}}
  - {key: bollinger, params: {window: 20, num_std: 2.0}}
  - {key: adx, params: {period: 14}}
  - {key: rsi, params: {period: 14}}
  - {key: roc, params: {period: 12}}
  - {key: stochastic, params: {k_window: 14, d_window: 3, smooth: 3}}
  - {key: atr, params: {period: 14}}
  - {key: rolling_volatility, params: {window: 24, annualize: true, periods_per_year: 0}}
  - {key: volume, params: {}}
  - {key: volume_ma, params: {window: 20}}
