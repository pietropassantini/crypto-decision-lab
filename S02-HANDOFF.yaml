decisions:
  - "Contratto di esecuzione: entry all'open del bar cutoff+latenza, exit all'open del bar entry+orizzonte (holding misurato dal fill). A latenza 0 riduce esattamente al contratto CP07/CP09 legacy (riconciliazione richiesta dal PRD); la latenza è ora un parametro dichiarato nel manifest."
  - "Feature stazionarie riusate da regime_analysis.compute_features (CP06B): niente livelli di prezzo, disponibilità registrata per riga (feature_available_at = cutoff; feature_bar = cutoff-1h)."
  - "Catalogo in JSON (config/dataset-catalog.json) per evitare la dipendenza opzionale PyYAML nei test; guardia alias basata su digest sha256 dei parquet riservati (copie/rinomine incluse)."
  - "Dataset di ricerca costruito con latenza 0 e costi CP07 di default (fee 0.001/side, slippage 0.0005/side), stride 24h, warmup 168h: 2061 finestre 2021-01-08→2026-10-22; finestre attorno ai 14 buchi orari documentati saltate in modo deterministico (gap fino a 14 giorni tra cutoff eleggibili)."
  - "Il dataset rimane non tracciato (regola S00A: dataset generati rigenerabili/ignorati); la riproducibilità è garantita da comando CLI + digest nel manifest + test."
  - "Aggiornata la riga S00A del backlog a IN_REVIEW (commit 6414abd esistente ma riga non aggiornata dal proprietario dello step)."
