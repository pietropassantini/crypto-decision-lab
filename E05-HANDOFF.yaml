decisions:
  - "Sviluppo (2021-02 / 2023-07): 8 configurazioni positive su 12, 11 con almeno 12 trade. Selezionata g10 (rendimento a 28 giorni, media a 100 giorni, soglia 0): +28,19%, drawdown -17,19%, 16 trade chiusi (6,6/anno), lordo +153,8 (9,6 per trade), costi 12,8, tempo in mercato 26%. Baseline: momentum_v1 -95,4%, buy and hold -4,0% con drawdown -52,1%."
  - "Validazione (2023-07 / 2025-01): g10 +70,87%, drawdown -13,08%, 17 trade (11,3/anno), lordo +371,9 (21,9 per trade), costi 17,6, tempo in mercato 55%, 35% di trade vincenti. Tutti i 5 criteri superati. Buy and hold +103,17% con drawdown -22,84%: la strategia rende meno del buy and hold ma con circa meta del drawdown."
  - "Conferma (2025-01 / 2026-10, valutata una volta): g10 +4,98%, drawdown -9,33%, 17 trade, lordo +37,7 (2,2 per trade), costi 12,8, tempo in mercato 34%. Entrambi i criteri superati. Buy and hold -5,35% con drawdown -30,82%."
  - "Esito CANDIDATE secondo i criteri registrati: e il primo esperimento in cui il lordo per trade supera con margine il costo (0,75) e la soglia di accettazione (1,5) su tutte e tre le finestre. Per la specifica CANDIDATE non e un rilascio: porta a una sessione paper preregistrata su dati nuovi (testnet, almeno 12 settimane) e solo dopo a criteri S08."
