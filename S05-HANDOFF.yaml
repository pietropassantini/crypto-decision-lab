decisions:
  - "Modello in JSON con digest (nessun pickle): portabile, verificabile e ricalcolabile in numpy; sklearn solo per il fit."
  - "Training solo sulle entrate della baseline: il modello filtra ingressi, non genera segnali."
  - "Strategie a decision point: decidono ai cutoff S02 e mantengono l'esposizione tra un cutoff e il successivo; con stride = orizzonte i fill coincidono con i prezzi dei target. Una posizione persistente non paga costi intermedi, per questo il motore e il riferimento economico e i target sono il criterio di selezione sullo sviluppo."
  - "La specifica blocca dataset (digest), seed, fold, griglia e criteri; il runner rifiuta digest diversi, directory esistenti e output sotto data/forward."
  - "max_holding_hours=720 nel motore: le uscite sono decise dalla strategia ai cutoff; l'orizzonte del motore e solo una protezione."
  - "Fold di test nel segmento continuo 2023-03-24 -> 2026-10-23 perche il motore si arresta ai gap; sviluppo e training usano i target S02 che escludono gia le finestre con gap."
  - "Il candidato registrato e il modello dell'ultimo fold; con esito diverso da CANDIDATE e marcato non utilizzabile."
