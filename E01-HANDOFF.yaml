decisions:
  - "Sviluppo (2021-02 / 2023-07): tutte le 12 configurazioni negative, da -87,2% (g00: soglia 0,005, 12 h) a -29,6% (g11: soglia 0,03, 48 h); il rendimento migliora in modo monotono con soglia e orizzonte. Baseline (soglia 0, 6 h): -95,4%, 2148 trade, 891,5 trade/anno, lordo +55,9 e costi 532,7. Selezionata g11: -29,6%, drawdown -42,1%, 468 trade (194,2/anno), lordo +146,3, costi 294,6."
  - "Validazione (2023-07 / 2025-01): g11 -20,28%, drawdown -24,26%, 206 trade (136,8/anno = 14,6% della baseline), lordo +36,1, costi 137,5. Passano drawdown, numero di trade e turnover (<= 30% della baseline); falliscono rendimento netto > 0 e costi <= 50% del lordo. Baseline -85,40%, 1411 trade."
  - "Conferma (2025-01 / 2026-10, valutata una volta come da specifica): g11 -28,21%, drawdown -32,43%, 184 trade, lordo -28,6. Baseline -91,09%."
  - "Esito REJECTED secondo i criteri registrati. L'ipotesi H-turnover e confermata solo a meta: soglia e orizzonte piu alti riducono il turnover di circa 7 volte e il danno dei costi, ma il vantaggio lordo di momentum_24h e troppo piccolo (validazione +7,2% lordo su 18 mesi) per coprire i costi anche con 137 trade l'anno, e in conferma il lordo e negativo."
  - "Osservazione per una ipotesi successiva (non preregistrata): quasi tutte le uscite sono della strategia (momentum sotto soglia), solo 1 a orizzonte in sviluppo e conferma: l'orizzonte non vincola, il turnover lo decide il segnale che oscilla attorno alla soglia. Un'isteresi (soglia di uscita diversa da quella di ingresso) o un filtro di regime sarebbero il passo successivo, in una specifica nuova."
interpretations:
